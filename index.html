<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore SESI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> 
        <h1>TechStore SESI</h1>

        <section class="formulario">
            <h3>Dados da Venda</h3>
            <label for="inputNome"> Nome do cliente</label>
            <input type="text" id="inputNome" placeholder="Nome do Cliente" required autocomplete="name">

            <label for="inputIdade">Idade</label>
            <input type="number" id="inputIdade" placeholder="Idade do Cliente" min="0" required>

            <label for="inputValor">Valor Total</label>
            <input type="number" id="inputValor" placeholder="Valor Total (R$)" min="0" step="0.01" required>

            <label for="inputCupom">Tem cupom?</label>
            <select id="inputCupom">
                <option value="false"> Não </option>
                <option value="true"> Sim(15% OFF)</option>
            </select>


            <label for="inputCadastro">Tem cadastro?</label>
            <select id="inputCadastro" onchange="verificarCadastro()">
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
            </select>

<div id="novoCadastro" style="display:none;">
    <label for="desejaCadastrar">Deseja fazer cadastro?</label>
    <select id="desejaCadastrar" onchange="mostrarCamposCadastro()">
        <option value="sim">Sim</option>
        <option value="nao">Não</option>
    </select>
</div>

<div id="dadosCadastro" style="display:none;">
    <label for="inputCpf">CPF</label>
    <input type="text" id="inputCpf">

    <label for="inputEmail">E-mail</label>
    <input type="email" id="inputEmail">
</div>


            <button id="btnFinalizar" onclick="executarSistemas()">Finalizar Venda</button>

        <hr> 

        <section id="feedback">
            <p id="mensagem-autorizacao">Preencha os dados acima.</p>

            <ul id="lista-estoque"></ul>

            <div id="relatorio-final" class="card" style="display:none;">
            </div>
        </section> 
    </div>

    <script src="script.js"></script>    
</body>
</html>
